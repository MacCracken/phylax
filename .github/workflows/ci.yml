name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Use the canonical scripts/install.sh from cyrius main. Reads
        # CYRIUS_VERSION from cyrius.cyml [package].cyrius so the pin lives
        # in one place. install.sh stages ~/.cyrius/versions/$VERSION/ and
        # symlinks ~/.cyrius/bin/ for PATH. Same pattern sigil uses.
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
          echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        # `lib/` is a derived artifact (gitignored, untracked since
        # 445a60f) — the dep contract is cyrius.cyml + cyrius.lock,
        # rehydrated here against the pinned toolchain snapshot (stdlib,
        # incl. the carved `bayan` bundle) plus the pinned git bundles.
        # `rm -rf lib` first is defensive: on a fresh runner there's no
        # ./lib/, but a cached/self-hosted runner could carry a stale one
        # that *shadows* the snapshot (declared stdlib names resolve to
        # ./lib/<name>.cyr with no fall-through). Since cyrius 6.1.25's
        # bayan carve deleted json/toml/csv/base64/bigint from stdlib, a
        # stale ./lib/ supplying those would mask a manifest that hasn't
        # migrated to `bayan`. Starting clean keeps resolution honest.
        #
        # ⚠ The order matters. `cyrius deps` WRITES cyrius.lock — since cyrius
        # 6.6.9 it adds any row the committed lock is missing — so running it
        # before a check lets it repair the very lock the check is meant to
        # audit. Measured at 1.3.0: delete a row from cyrius.lock, and the old
        # `cyrius deps` then `cyrius deps --verify` sequence PASSES. So check
        # first with `--locked` (cyrius 6.7.6): it resolves the tags, compares
        # them with the committed lock, writes nothing, and exits 1 on any
        # missing, extra or differing row. Then vendor.
        run: |
          rm -rf lib
          if [ -f cyrius.lock ]; then
            cyrius deps --locked
          else
            echo "::warning::cyrius.lock not committed — skipping the lock check"
          fi
          cyrius deps
          git diff --exit-code cyrius.lock || {
            echo "FAIL: cyrius deps changed cyrius.lock"; exit 1; }

      - name: Verify dep hashes
        # With lib/ vendored, `--locked` also checks every vendored file's
        # bytes against what the tags resolve (a tampered or stale file under
        # lib/ exits 1), in addition to the lock itself.
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --locked
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Format check
        # ⚠ cyrius 6.5.28 changed BOTH halves of what this step used to rely on.
        # `cyrius fmt <file>` now REWRITES THE FILE IN PLACE, and stdout carries
        # a one-line report rather than the formatted source. The old pattern
        # here — `diff <(cyrius fmt "$f") "$f"` — was therefore broken two ways
        # at once from 6.5.28 on, and neither way is loud: the bare invocation
        # silently reformats the very checkout it is auditing, and the diff then
        # compares a one-line report against every non-empty source file, so the
        # whole tree reports as drifted. Adding `--dry` fixes only the first
        # half; it reports without writing but does NOT restore the pipeable
        # stream. `--check` is the supported primitive now: it exits non-zero and
        # names the first differing file:line itself, so no diff is needed.
        run: |
          fail=0
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr; do
            [ -f "$f" ] || continue
            cyrius fmt --check "$f" || fail=1
          done
          [ $fail -eq 0 ] || {
            echo "fmt: drift detected — run 'cyrius fmt <file>' on the files above"
            exit 1
          }

      - name: Lint (advisory)
        # Advisory-only; tighten to fail-on-warning once standing
        # warnings are addressed.
        continue-on-error: true
        run: |
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr; do
            [ -f "$f" ] || continue
            cyrius lint "$f"
          done

      - name: Vet
        run: cyrius vet src/main.cyr

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/phylax
          echo "phylax: $(wc -c < build/phylax) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/phylax | grep -q "7f45 4c46"

      - name: Cross-build + test aarch64 (best-effort)
        # ⚠ Until 1.3.0 this step tested for `cc5_aarch64`, a compiler name the
        # toolchain stopped shipping (it is `cycc_aarch64`), so it skipped on
        # every run — and its comment said the build was blocked on
        # `f64_log2`, which stopped being true long before (it built on 6.6.2;
        # aarch64 lowers f64_log2 to lib/math.cyr's polyfill). The x86 suite
        # cannot see aarch64-only breakage: until 1.3.0 phylax's x86 SYS_* /
        # O_NOFOLLOW globals broke `phylax watch` and the symlink refusal on
        # aarch64 while every x86 test passed. So this runs the full suite
        # under qemu-aarch64 (`cyrius test --aarch64`). Best-effort only
        # because it depends on installing qemu-user on the runner.
        continue-on-error: true
        run: |
          if [ ! -x "$HOME/.cyrius/bin/cycc_aarch64" ]; then
            echo "::warning::cycc_aarch64 not shipped with this Cyrius — skipping"
            exit 0
          fi
          CYRIUS_DCE=1 cyrius build --aarch64 src/main.cyr build/phylax-aarch64
          file build/phylax-aarch64 | grep -q "aarch64" || {
            echo "ERROR: phylax-aarch64 is not aarch64 ELF"; exit 1; }
          echo "phylax-aarch64: $(wc -c < build/phylax-aarch64) bytes"
          sudo apt-get install -y -qq qemu-user >/dev/null || {
            echo "::warning::qemu-user unavailable — aarch64 build checked, tests not run"
            exit 0
          }
          fail=0
          for t in tests/*.tcyr; do
            cyrius test --aarch64 "$t" || { echo "FAIL (aarch64): $t"; fail=1; }
          done
          [ $fail -eq 0 ] || { echo "aarch64 test failures"; exit 1; }

      - name: dist/ bundles are up-to-date
        # `cyrius distlib` emits dist/phylax.cyr from [lib] modules and
        # `cyrius distlib core` emits dist/phylax-core.cyr from [lib.core].
        #
        # ⚠ This step used to run `cyrius distlib || true` (and the same for
        # core) and then `git diff dist/`. From cyrius 6.6.18 that shape hides a
        # real failure: distlib compile-verifies each bundle on six targets and,
        # when one refuses, exits 1 with "sidecar NOT written" — after already
        # rewriting the bundle body. At the 1.2.8 bump exactly that happened
        # (aarch64: f64_log2 needs lib/math.cyr there), so the headers moved,
        # the .deps sidecars stayed stale, and `|| true` would have let it pass.
        # `--check` regenerates base + every profile in scratch, compares them
        # with what is committed, writes nothing, and its exit status is
        # honoured: 0 when current, 1 when stale or when a verify refuses.
        # (A "names still undefined" warning — sys_stat/sys_fstat on
        # x86_64-windows, a target phylax does not build for — is a warning,
        # not a failure.)
        run: |
          cyrius distlib --check || {
            echo "FAIL: dist/ bundles are stale or refused. Run 'cyrius distlib --all' and commit."
            exit 1
          }
          echo "dist/phylax.cyr:      $(wc -l < dist/phylax.cyr) lines, $(wc -c < dist/phylax.cyr) bytes"
          echo "dist/phylax-core.cyr: $(wc -l < dist/phylax-core.cyr) lines, $(wc -c < dist/phylax-core.cyr) bytes"

      - name: Test
        # Per-module test files under tests/test_*.tcyr (split 2026-05-11)
        # so a segfault in one module doesn't take out the whole suite.
        # phylax-core.tcyr remains as the [lib.core] smoke test.
        run: |
          fail=0
          passed_modules=()
          failed_modules=()
          for t in tests/*.tcyr; do
            [ -f "$t" ] || continue
            name=$(basename "$t" .tcyr)
            echo "=== $name ==="
            if cyrius test "$t"; then
              passed_modules+=("$name")
            else
              echo "FAIL: $name (exit $?)"
              failed_modules+=("$name")
              fail=1
            fi
          done
          echo ""
          echo "===== summary ====="
          echo "passed: ${#passed_modules[@]} — ${passed_modules[*]}"
          echo "failed: ${#failed_modules[@]} — ${failed_modules[*]}"
          [ $fail -eq 0 ] || { echo "test failures"; exit 1; }

      - name: Bench
        # Non-fatal — bench numbers vary by runner.
        continue-on-error: true
        run: |
          for b in tests/*.bcyr; do
            [ -f "$b" ] || continue
            cyrius bench "$b"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-x86_64
          path: build/phylax
          retention-days: 5

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        # phylax is a threat detection engine — it parses untrusted
        # PE/ELF/archive bytes. Scan for patterns that should never
        # appear: shell-out, writes to system paths, unbounded stack
        # buffers, raw exec syscalls outside the orchestrator path.
        # Matches code lines only — comments (#) are skipped.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          # Shell-out is forbidden — phylax never executes user-supplied content.
          scan "sys_system"      '\bsys_system\s*\('
          scan "raw system()"    '\bsystem\s*\('
          # Writes to system paths — phylax only reads scan targets and writes
          # to its own quarantine/output trees.
          scan "writes to /etc"  '"/etc/'
          scan "writes to /bin"  '"/bin/'
          scan "writes to /sbin" '"/sbin/'
          # Unbounded stack buffers (>= 64 KB) — force heap review.
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr 2>/dev/null | tee /tmp/bigbuf.txt
          [ -s /tmp/bigbuf.txt ] && FAIL=1
          # Informational counts — fd hygiene tracking.
          OPENS=$(grep -rn 'sys_open' src/ 2>/dev/null | awk -F: '
            { line=$3; sub(/^[[:space:]]+/,"",line);
              if (substr(line,1,1) != "#") print }' | wc -l)
          CLOSES=$(grep -rn 'sys_close' src/ 2>/dev/null | awk -F: '
            { line=$3; sub(/^[[:space:]]+/,"",line);
              if (substr(line,1,1) != "#") print }' | wc -l)
          echo "sys_open: $OPENS, sys_close: $CLOSES (informational)"
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md \
                   CODE_OF_CONDUCT.md LICENSE CLAUDE.md cyrius.cyml \
                   dist/phylax.cyr dist/phylax-core.cyr; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        # cyrius.cyml pulls package.version from VERSION via ${file:VERSION},
        # so the manifest cannot drift. Two things CAN, and one of them did:
        #
        #  * CHANGELOG.md must carry an entry for the version (checked since
        #    the beginning).
        #  * src/types.cyr hardcodes the string that `--version` prints and
        #    that lands in `scanner_version` in every JSON / SARIF / Markdown
        #    report. It is NOT derived from the VERSION file. It silently
        #    lagged two releases — VERSION said 1.2.4 while the binary and
        #    every report it stamped said 1.2.3 — because nothing compared
        #    them. That is what this second check exists for.
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -q "$VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          SRC_VERSION=$(grep -oP '(?<=VERSION = str_from\(")[^"]+' src/types.cyr)
          echo "src/types.cyr: $SRC_VERSION"
          [ "$SRC_VERSION" = "$VERSION" ] || {
            echo "FAIL: src/types.cyr VERSION ($SRC_VERSION) != VERSION file ($VERSION)"
            echo "      this string is what --version prints and what reports stamp as scanner_version"
            exit 1
          }
          # The 1.2.7 cut replaced the template with a literal "1.2.7", which
          # nothing caught — and from cyrius 6.6.20 distlib stamps each bundle's
          # `# Version:` from the MANIFEST, so the literal leaked into dist/.
          grep -qF 'version = "${file:VERSION}"' cyrius.cyml || {
            echo "FAIL: cyrius.cyml [package] version must be \"\${file:VERSION}\", not a literal"
            exit 1
          }
          echo "Version consistent (cyrius.cyml pulls VERSION via \${file:VERSION})"
